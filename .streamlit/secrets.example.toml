# ============================================================
# MyBooks - Streamlit Secrets
# Cole estas variáveis em:
# Streamlit Cloud > App > Settings > Secrets
#
# NÃO faça commit de .streamlit/secrets.toml.
# ============================================================

# Aplicação
APP_NAME = "MyBooks"
APP_URL = "https://SEU-APP.streamlit.app"
APP_DEBUG = false
AUTO_CREATE_SCHEMA = true

# Neon PostgreSQL
# No Neon Console: Project > Connect > copie a connection string.
# Recomendado para o Streamlit: usar a string POOLED (-pooler no hostname).
# Deve incluir sslmode=require.
#
# Exemplo:
# DATABASE_URL = "postgresql://USER:PASSWORD@ep-xxxx-pooler.eu-central-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require"
DATABASE_URL = "COLE_AQUI_A_CONNECTION_STRING_DO_NEON"

# SMTP / MFA por e-mail
SMTP_HOST = "smtp.seudominio.pt"
SMTP_PORT = 587
SMTP_USERNAME = "no-reply@seudominio.pt"
SMTP_PASSWORD = "ALTERAR"
SMTP_FROM_EMAIL = "no-reply@seudominio.pt"
SMTP_FROM_NAME = "MyBooks"
SMTP_SECURITY = "SSL"
SMTP_TIMEOUT = 20
# Temporariamente true para mostrar apenas o CÓDIGO seguro do erro SMTP na tela de login.
# Depois de resolver, volte para false.
SMTP_DIAGNOSTICS = true

# Segurança
# Gere valores aleatórios, fortes e DIFERENTES:
# python -c "import secrets; print(secrets.token_hex(32))"
MFA_PEPPER = "GERAR_64_HEX_AQUI"
TOKEN_PEPPER = "GERAR_OUTRO_64_HEX_AQUI"

# Bootstrap do primeiro administrador.
# Só é usado quando a tabela users estiver vazia.
BOOTSTRAP_ADMIN_EMAIL = "admin@seudominio.pt"
BOOTSTRAP_ADMIN_NAME = "Administrador"
BOOTSTRAP_ADMIN_PASSWORD = "ALTERAR-POR-UMA-SENHA-FORTE"
