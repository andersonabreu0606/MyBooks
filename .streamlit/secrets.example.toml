# Copie este conteúdo para o Secrets Management do Streamlit Cloud.
# Não faça commit de secrets.toml no Git.

APP_URL = "https://SEU-APP.streamlit.app"

# MySQL
DB_HOST = "mysql.seudominio.pt"
DB_PORT = 3306
DB_NAME = "bookapp"
DB_USER = "bookapp_app"
DB_PASSWORD = "ALTERAR"
DB_SSL_ENABLED = true

# Se o servidor MySQL usar CA própria/self-signed, coloque a CA PEM completa.
# Se usar certificado emitido por CA pública, normalmente deixe vazio.
DB_SSL_CA_PEM = ""

# SMTP
SMTP_HOST = "smtp.seudominio.pt"
SMTP_PORT = 587
SMTP_USERNAME = "no-reply@seudominio.pt"
SMTP_PASSWORD = "ALTERAR"
SMTP_FROM_EMAIL = "no-reply@seudominio.pt"
SMTP_FROM_NAME = "BookApp"
# STARTTLS (porta 587) ou SSL (porta 465)
SMTP_SECURITY = "STARTTLS"

# Segredos criptográficos: gere valores aleatórios fortes e diferentes.
# Exemplo local: python -c "import secrets; print(secrets.token_hex(32))"
MFA_PEPPER = "GERAR_64_HEX_AQUI"
TOKEN_PEPPER = "GERAR_OUTRO_64_HEX_AQUI"

# Bootstrap do primeiro administrador.
# É usado SOMENTE se a tabela de utilizadores estiver vazia.
# Após o primeiro deploy e primeiro login, remova BOOTSTRAP_ADMIN_PASSWORD.
BOOTSTRAP_ADMIN_EMAIL = "admin@seudominio.pt"
BOOTSTRAP_ADMIN_NAME = "Administrador"
BOOTSTRAP_ADMIN_PASSWORD = "ALTERAR-POR-UMA-SENHA-FORTE"
